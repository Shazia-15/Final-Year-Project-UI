<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Signin-up.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-card p-4">
            <h2 class="text-center mb-4">Welcome to VenueVista</h2>

            <h4 class="text-center mb-3 signin-title">Sign In</h4>

            <form>
                <div class="mb-3">
                    <label class="form-label custom-label">Email</label>
                    <input type="email" class="form-control custom-input" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">Password</label>
                    <input type="password" class="form-control custom-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn custom-btn w-100">Sign In</button>

                <div class="anchor"><p>Don't have an account? <a href="sign-up.html">Sign Up</a></p></div>
            </form>
        </div>
    </div>

</body>

</html>
