<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
</head>


<style>
    /* MAIN SECTION */
    .business-section {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }
</style>
</head>

<body>
    <!-- Hero Sections -->
    <div class="container-fluid hero">
        <img src="https://images.squarespace-cdn.com/content/v1/575db4924d088eb0ab81b806/9645b9cd-a98c-4f14-ad31-e2006819bd1e/All+You+Need+Wedding+Styling+4.jpg?format=750w"
            alt="">
        <div class="hero-text">
            <h1>Contact Us</h1>
            <p>Hey! Leave a message and we'll get back to you ASAP.</p>
        </div>
    </div> 
    
    <!-- Information Section -->
    <div class="container">
        <h1>CONTACT INFORMATION</h1>
        <P>We'd love to hear from you! Reach us through:</P>
        <div class="row">
            <div class="col-md-4"> <img src="images/location.png" alt="">
                <div>
                    <p>XYZ Office</p>
                    <p>P.O. Box: 1907, PC 211</p>
                </div>
            </div>
            <div class="col-md-4"> <img src="images/phone.png" alt="">
                <div>
                    <p>+921234567891</p>
                    <p>+921234567891</p>
                </div>
            </div>
            <div class="col-md-4"> <img src="images/earth.png" alt="">
                <div>
                    <p>abc@gmail.com</p>
                    <p>xyz@gmail.com</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Send us a message section -->
    <section class="message">
        <div class="container">
            <h1>SEND US A MESSAGE</h1>
            <div class="row">
                <div class="col-sm-5">
                    <label for="name" id="label">Your Name</label><br>
                    <input class="input" type="text" name="name" id="name" placeholder=""><br>

                    <label for="email" id="label">Your Email</label><br>
                    <input class="input" type="text" name="email" id="email" placeholder=""><br>

                    <label for="subject" id="label">Subject</label><br>
                    <input class="input" type="text" name="subject" id="subject" placeholder="">
                </div>
                <div class="col-sm-5"> <label for="message" id="label">Message</label><br>
                    <textarea name="message" id="message" class="form-control"></textarea><br> <button
                        class="btn-send">Send Now</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
